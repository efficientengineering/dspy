# Probe: MACHINE gen3 resource classes
version: 2.1
commands:
  ok:
    steps:
      - run: echo "AVAILABLE"; nproc; free -h | head -2
jobs:
  m-medium-gen3:  {machine: {image: ubuntu-2404:current}, resource_class: medium.gen3,   steps: [ok]}
  m-large-gen3:   {machine: {image: ubuntu-2404:current}, resource_class: large.gen3,    steps: [ok]}
  m-xlarge-gen3:  {machine: {image: ubuntu-2404:current}, resource_class: xlarge.gen3,   steps: [ok]}
  m-2xlarge-gen3: {machine: {image: ubuntu-2404:current}, resource_class: 2xlarge.gen3,  steps: [ok]}
workflows:
  probe-gen3:
    jobs: [m-medium-gen3, m-large-gen3, m-xlarge-gen3, m-2xlarge-gen3]
