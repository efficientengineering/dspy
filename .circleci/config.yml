version: 2.1

jobs:
  fix:
    docker:
      - image: cimg/python:3.11
    resource_class: medium
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_FIX $(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT $(date +%s%N)"
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - uv-cache-fix-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
            - uv-cache-fix-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL $(date +%s%N)"
      - run:
          name: Create and activate virtual environment
          command: |
            uv venv .venv
            echo "export PATH=\"$(pwd)/.venv/bin:\$PATH\"" >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: uv sync --dev -p .venv --extra dev
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL $(date +%s%N)"
      - save_cache:
          key: uv-cache-fix-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Start Test
          command: echo "STEP_START_TEST $(date +%s%N)"
      - run:
          name: Ruff Check
          command: |
            ruff check --fix-only --diff --exit-non-zero-on-fix || (
              echo ""
              echo "\u274c Ruff found issues that can be fixed automatically."
              echo "\ud83d\udca1 To fix them locally, run:"
              echo ""
              echo "    pre-commit run --all-files"
              echo ""
              echo "Then commit and push the changes."
              exit 1
            )
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST $(date +%s%N)"

  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: medium
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_TEST_<< parameters.python-version >> $(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT $(date +%s%N)"
      - run:
          name: Install Deno
          command: |
            curl -fsSL https://deno.land/install.sh | sh -s v2.7.7
            echo 'export DENO_INSTALL="$HOME/.deno"' >> "$BASH_ENV"
            echo 'export PATH="$HOME/.deno/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Verify Deno installation
          command: deno --version
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - uv-cache-test-<< parameters.python-version >>-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
            - uv-cache-test-<< parameters.python-version >>-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL $(date +%s%N)"
      - run:
          name: Create and activate virtual environment
          command: |
            uv venv .venv
            echo "export PATH=\"$(pwd)/.venv/bin:\$PATH\"" >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: |
            uv sync --dev -p .venv --extra dev
            uv pip list
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL $(date +%s%N)"
      - save_cache:
          key: uv-cache-test-<< parameters.python-version >>-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Start Test
          command: echo "STEP_START_TEST $(date +%s%N)"
      - run:
          name: Run lint with ruff
          command: ruff check --fix-only
      - run:
          name: Run tests with pytest
          command: uv run -p .venv pytest -vv tests/
      - run:
          name: Install optional dependencies
          command: uv sync -p .venv --extra dev --extra test_extras
      - run:
          name: Run extra and deno tests
          command: uv run -p .venv pytest tests/ -m 'extra or deno' --extra --deno
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST $(date +%s%N)"

  llm_call_test:
    machine:
      image: ubuntu-2204:current
    resource_class: medium.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_LLM_CALL_TEST $(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT $(date +%s%N)"
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Python 3.11
          command: uv python install 3.11
      - restore_cache:
          keys:
            - uv-cache-llm-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
            - uv-cache-llm-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL $(date +%s%N)"
      - run:
          name: Create and activate virtual environment
          command: |
            uv venv .venv --python 3.11
            echo "export PATH=\"$(pwd)/.venv/bin:\$PATH\"" >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: |
            uv sync --dev -p .venv --extra dev
            uv pip list
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL $(date +%s%N)"
      - save_cache:
          key: uv-cache-llm-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - restore_cache:
          keys:
            - ollama-llama3.2-3b-v1
      - run:
          name: Start Ollama service
          command: |
            mkdir -p ollama-data
            docker run -d --name ollama \
              -p 11434:11434 \
              -v $(pwd)/ollama-data:/root/.ollama \
              ollama/ollama:latest
            timeout 60 bash -c 'until curl -f http://localhost:11434/api/version; do sleep 2; done'
      - run:
          name: Pull LLM
          command: docker exec ollama ollama pull llama3.2:3b
      - run:
          name: Fix permissions for cache
          command: sudo chown -R $USER:$USER ollama-data || true
      - save_cache:
          key: ollama-llama3.2-3b-v1
          paths:
            - ollama-data
      - run:
          name: Set LM environment variable
          command: echo 'export LM_FOR_TEST="ollama/llama3.2:3b"' >> "$BASH_ENV"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST $(date +%s%N)"
      - run:
          name: Run tests
          command: uv run -p .venv pytest -m llm_call --llm_call -vv --durations=5 tests/
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST $(date +%s%N)"
      - run:
          name: Stop Ollama service
          command: docker stop ollama && docker rm ollama
          when: always

  build_package:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: medium
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_BUILD_PACKAGE_<< parameters.python-version >> $(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT $(date +%s%N)"
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - uv-cache-build-<< parameters.python-version >>-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
            - uv-cache-build-<< parameters.python-version >>-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL $(date +%s%N)"
      - run:
          name: Create and activate virtual environment
          command: |
            uv venv .venv
            echo "export PATH=\"$(pwd)/.venv/bin:\$PATH\"" >> "$BASH_ENV"
      - run:
          name: Install dependencies
          command: uv sync --dev -p .venv --extra dev
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL $(date +%s%N)"
      - save_cache:
          key: uv-cache-build-<< parameters.python-version >>-{{ checksum "pyproject.toml" }}-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Start Test
          command: echo "STEP_START_TEST $(date +%s%N)"
      - run:
          name: Build
          command: uv run -p .venv python -m build
      - run:
          name: Install built package
          command: uv pip install dist/*.whl -p .venv
      - run:
          name: Test import dspy
          command: uv run -p .venv python -c "import dspy"
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST $(date +%s%N)"

workflows:
  lint-test-build:
    jobs:
      - fix
      - test:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      - llm_call_test
      - build_package:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
